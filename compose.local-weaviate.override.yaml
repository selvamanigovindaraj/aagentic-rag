# Local Weaviate for reproduction/debugging only -- Weaviate stays cloud-hosted
# by default (AGENTS.md: "never add a local Weaviate container"). This is an
# explicit opt-in override, not part of the default stack.
#
# Usage:
#   1. In your .env, point WEAVIATE_URL/WEAVIATE_API_KEY at this local
#      service instead of Weaviate Cloud, e.g.:
#        WEAVIATE_URL=http://weaviate:8080
#        WEAVIATE_API_KEY=agentic-rag-dev-key
#      (compose.yaml's api/worker environment requires these to be set
#      regardless of which Weaviate you point at -- this file only adds the
#      local `weaviate` service and its dependency wiring, it can't inject
#      WEAVIATE_URL for you: Compose interpolates each -f file's own
#      ${VAR:?...} independently before merging, so a value set only here
#      would never satisfy the base file's required-variable check.)
#   2. docker compose -f compose.yaml -f compose.local-weaviate.override.yaml up --build
services:
  api:
    depends_on:
      weaviate: {condition: service_healthy}
  worker:
    depends_on:
      weaviate: {condition: service_healthy}
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.31.1
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-agentic-rag-dev-key}
      AUTHENTICATION_APIKEY_USERS: rag-dev
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: rag-dev
      # Go's runtime otherwise sizes its heap/GC target off the full host
      # memory it sees rather than this container's actual ~10K-object
      # collection -- pin it well below the container's hard mem_limit.
      # (Not paired with LIMIT_RESOURCES: Weaviate's docs confirm that flag
      # overrides/ignores GOMEMLIMIT, which would silently undo this cap.)
      GOMEMLIMIT: 900MiB
    mem_limit: 1200m
    ports: ["8080:8080", "50051:50051"]
    volumes: ["weaviatedata:/var/lib/weaviate"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes: {weaviatedata: {}}
