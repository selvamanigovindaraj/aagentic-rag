server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 64m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass $api_upstream;
    proxy_buffering off;
    proxy_cache off;
  }
}
