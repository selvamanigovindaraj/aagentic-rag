[project]
name = "agentic-rag"
version = "0.1.0"
description = "Production-shaped agentic RAG for large enterprise corpora"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<2",
  "langchain-voyageai>=0.1,<1",
  "neo4j>=5.28,<7",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-jose[cryptography]>=3.4,<4",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
  "langgraph-checkpoint-postgres>=3,<4",
  "langsmith>=0.4,<1",
  "psycopg[binary,pool]>=3.3,<4",
  "langchain-litellm>=0.2.2,<1",
  "arize-phoenix-otel>=0.16.1",
  "openinference-instrumentation-langchain>=0.1.67",
  "arize-phoenix-client>=2.13.0",
  "arize-phoenix-evals>=3.3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
